<div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-primary-container text-on-primary flex items-center justify-center shadow">

</div>
</div>
<div class="text-center w-full mb-space-lg px-space-xs relative z-10">
<h2 class="font-headline-md text-headline-md text-on-surface tracking-tight">
        Aman says he paid you <span class="font-label-numeric-lg text-primary tracking-normal">₹450</span>
</h2>
</div>
<div class="w-full flex flex-col gap-space-sm relative z-10">
<button class="w-full h-12 rounded-full bg-primary-container text-on-primary font-headline-sm text-headline-sm flex items-center justify-center transition-transform active:scale-[0.98] shadow-lg" onclick="handleAction('confirmed')">
        Confirm
      </button>
<button class="w-full h-12 rounded-full bg-surface-container-high/40 text-on-surface-variant font-headline-sm text-headline-sm flex items-center justify-center transition-colors active:scale-[0.98]" onclick="handleAction('rejected')">
        Reject
      </button>
</div>
<div class="mt-space-md text-center relative z-10">
<p class="font-body-sm text-body-sm text-on-surface-variant/70 tracking-wide">
        Via UPI, today 6:42 PM
      </p>
</div>
</div>
</div>
<script>
  function dismissPrompt() {
    const card = document.querySelector('.backdrop-blur-2xl');
    if (card) {
      card.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
      card.style.opacity = '0';
      card.style.transform = 'scale(0.96)';
      setTimeout(() => history.back(), 200);
    }
  }

  function handleAction(type) {
    const card = document.querySelector('.backdrop-blur-2xl');
    if (card) {
      card.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
      card.style.opacity = '0';
      card.style.transform = type === 'confirmed' ? 'translateY(-8px) scale(0.98)' : 'scale(0.96)';
      setTimeout(() => history.back(), 220);
    }
  }
</script></main></body></html>
